    <style>
        /* ---------- Theme variables ---------- */
        :root {
            --accent-1: #667eea;
            --accent-2: #764ba2;
            --accent-fg: #5a6fd8;
            --accent-chip-bg: rgba(102, 126, 234, 0.12);
            --card-bg: rgba(255, 255, 255, 0.72);
            --card-border: rgba(255, 255, 255, 0.55);
            --input-border: rgba(35, 35, 80, 0.15);
            --input-bg: rgba(255, 255, 255, 0.9);
            --chip-bg: rgba(255, 255, 255, 0.65);
            --toolbar-bg: rgba(255, 255, 255, 0.55);
            --text: #24243e;
            --muted: #6b7280;
            --shadow: 0 8px 30px rgba(31, 38, 135, 0.15);
            --bg1: #667eea;
            --bg2: #764ba2;
            --bg3: #e96492;
            --blob1: rgba(255, 255, 255, 0.30);
            --blob2: rgba(255, 130, 200, 0.32);
            --blob3: rgba(130, 200, 255, 0.28);
            --head-text: rgba(255, 255, 255, 0.96);
        }

        body[data-theme="dark"] {
            --accent-fg: #a6b4ff;
            --accent-chip-bg: rgba(130, 140, 255, 0.18);
            --card-bg: rgba(22, 22, 46, 0.62);
            --card-border: rgba(255, 255, 255, 0.13);
            --input-border: rgba(255, 255, 255, 0.16);
            --input-bg: rgba(255, 255, 255, 0.08);
            --chip-bg: rgba(255, 255, 255, 0.08);
            --toolbar-bg: rgba(16, 16, 38, 0.55);
            --text: #ecebff;
            --muted: #9aa0c3;
            --shadow: 0 8px 30px rgba(0, 0, 0, 0.40);
            --bg1: #191932;
            --bg2: #2a1b4d;
            --bg3: #3a1e63;
            --blob1: rgba(140, 110, 255, 0.20);
            --blob2: rgba(255, 80, 180, 0.12);
            --blob3: rgba(60, 180, 255, 0.13);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Poppins', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
            background: linear-gradient(120deg, var(--bg1), var(--bg2), var(--bg3), var(--bg1));
            background-size: 300% 300%;
            animation: bgShift 20s ease infinite;
        }

        @keyframes bgShift {
            0%   { background-position: 0% 50%; }
            50%  { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* ---------- Floating background blobs ---------- */
        .blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(90px);
            z-index: 0;
            pointer-events: none;
        }
        .blob-1 { width: 460px; height: 460px; top: -140px; left: -140px; background: var(--blob1); animation: drift 26s ease-in-out infinite alternate; }
        .blob-2 { width: 380px; height: 380px; top: 30%; right: -160px; background: var(--blob2); animation: drift 32s ease-in-out infinite alternate-reverse; }
        .blob-3 { width: 420px; height: 420px; bottom: -180px; left: 25%; background: var(--blob3); animation: drift 38s ease-in-out infinite alternate; }

        @keyframes drift {
            from { transform: translate(0, 0) rotate(0deg) scale(1); }
            to   { transform: translate(70px, -50px) rotate(25deg) scale(1.12); }
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        /* ---------- Header ---------- */
        header {
            text-align: center;
            margin: 34px 0 26px;
        }

        h1 {
            font-size: 2.6rem;
            font-weight: 800;
            background: linear-gradient(90deg, #ffffff, #ffd9f3, #c7f0ff, #ffffff);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
            animation: shine 7s linear infinite;
        }

        @keyframes shine {
            to { background-position: 200% center; }
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.92);
            font-size: 1.05rem;
            margin-top: 6px;
        }

        /* ---------- Shared glass card ---------- */
        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            box-shadow: var(--shadow);
        }

        /* ---------- Theme toggle ---------- */
        .theme-btn {
            position: fixed;
            top: 16px;
            right: 16px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 1px solid var(--card-border);
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            font-size: 1.25rem;
            cursor: pointer;
            z-index: 100;
            box-shadow: var(--shadow);
            transition: transform 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .theme-btn:hover { transform: rotate(20deg) scale(1.08); }

        /* ---------- Input card ---------- */
        .input-card {
            padding: 22px 24px;
            margin-bottom: 18px;
        }

        .input-label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            font-size: 0.95rem;
        }

        .input-wrap { position: relative; }

        #textInput {
            width: 100%;
            padding: 13px 42px 13px 14px;
            border: 2px solid var(--input-border);
            border-radius: 12px;
            font-size: 1rem;
            font-family: inherit;
            background: var(--input-bg);
            color: var(--text);
            outline: none;
            transition: all 0.25s;
        }

        #textInput:focus {
            border-color: var(--accent-1);
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.18);
        }

        #textInput::placeholder { color: var(--muted); }

        .clear-btn {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            width: 26px;
            height: 26px;
            border-radius: 50%;
            border: none;
            background: rgba(125, 125, 160, 0.18);
            color: var(--text);
            font-size: 0.8rem;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }
        .clear-btn:hover { background: rgba(125, 125, 160, 0.32); }

        .char-count {
            margin-top: 8px;
            font-size: 0.82rem;
            color: var(--muted);
            text-align: right;
        }
        .char-count.warn { color: #ff9f43; font-weight: 600; }

        /* ---------- Sticky toolbar (categories + search) ---------- */
        .toolbar {
            position: sticky;
            top: 10px;
            z-index: 40;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            padding: 12px 16px;
            border-radius: 16px;
            background: var(--toolbar-bg);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid var(--card-border);
            box-shadow: var(--shadow);
            margin-bottom: 6px;
        }

        .chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            flex: 1;
        }

        .chip {
            padding: 8px 13px;
            border-radius: 999px;
            border: 1px solid var(--card-border);
            background: var(--chip-bg);
            color: var(--text);
            font-size: 0.84rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 7px;
            transition: all 0.25s;
            user-select: none;
        }
        .chip:hover { transform: translateY(-2px); border-color: var(--accent-1); }
        .chip.active {
            background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
            color: #fff;
            border-color: transparent;
            box-shadow: 0 4px 14px rgba(102, 126, 234, 0.40);
        }
        .chip .cnt {
            background: rgba(0, 0, 0, 0.10);
            border-radius: 999px;
            padding: 1px 8px;
            font-size: 0.7rem;
        }
        body[data-theme="dark"] .chip .cnt { background: rgba(255, 255, 255, 0.16); }
        .chip.active .cnt { background: rgba(255, 255, 255, 0.25); }

        .search-wrap { position: relative; }
        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 0.85rem;
            opacity: 0.7;
            pointer-events: none;
        }
        #searchInput {
            width: 230px;
            padding: 9px 14px 9px 34px;
            border-radius: 999px;
            border: 1px solid var(--input-border);
            background: var(--input-bg);
            color: var(--text);
            font-size: 0.88rem;
            font-family: inherit;
            outline: none;
            transition: all 0.25s;
        }
        #searchInput:focus {
            border-color: var(--accent-1);
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.18);
        }
        #searchInput::placeholder { color: var(--muted); }

        /* ---------- Sections & cards ---------- */
        .style-section { margin-top: 26px; }

        .section-head {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 13px;
        }
        .section-head h2 {
            font-size: 1.06rem;
            font-weight: 700;
            color: var(--head-text);
        }
        .sec-count {
            background: rgba(255, 255, 255, 0.22);
            color: var(--head-text);
            font-size: 0.72rem;
            padding: 2px 9px;
            border-radius: 999px;
        }
        .section-line {
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, rgba(255, 255, 255, 0.45), transparent);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
            gap: 14px;
        }

        .style-card {
            padding: 14px 16px;
            display: flex;
            flex-direction: column;
            gap: 9px;
            transition: transform 0.25s, box-shadow 0.25s, border-color 0.25s;
        }
        .style-card:hover {
            transform: translateY(-3px);
            border-color: var(--accent-1);
            box-shadow: 0 10px 26px rgba(102, 126, 234, 0.25);
        }

        .grid.anim .style-card {
            animation: cardIn 0.4s both;
            animation-delay: calc(var(--i, 0) * 30ms);
        }
        @keyframes cardIn {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .card-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .style-chip {
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.4px;
            text-transform: uppercase;
            color: var(--accent-fg);
            background: var(--accent-chip-bg);
            padding: 3px 10px;
            border-radius: 999px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .copy-btn {
            background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
            color: #fff;
            border: none;
            padding: 7px 14px;
            border-radius: 9px;
            font-size: 0.8rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.25s;
            flex-shrink: 0;
        }
        .copy-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(102, 126, 234, 0.40);
        }
        .copy-btn.copied {
            background: linear-gradient(135deg, #2ecc71, #27ae60);
        }

        .fancy-text {
            font-size: 1.12rem;
            word-break: break-all;
            line-height: 1.55;
            cursor: pointer;
            min-height: 1.5em;
            transition: color 0.2s;
        }
        .fancy-text:hover { color: var(--accent-fg); }

        .preview-hint {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--chip-bg);
            border: 1px dashed var(--card-border);
            padding: 6px 14px;
            border-radius: 999px;
            color: var(--text);
            font-size: 0.8rem;
            margin-bottom: 16px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .empty-msg {
            background: var(--card-bg);
            border: 1px dashed var(--card-border);
            border-radius: 14px;
            padding: 28px;
            text-align: center;
            color: var(--text);
            margin-top: 20px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        /* ---------- Footer & toast ---------- */
        .footer {
            text-align: center;
            color: rgba(255, 255, 255, 0.85);
            font-size: 0.85rem;
            margin: 42px 0 10px;
        }

        .toast {
            position: fixed;
            left: 50%;
            bottom: 26px;
            transform: translate(-50%, 90px);
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            color: #fff;
            padding: 11px 22px;
            border-radius: 999px;
            box-shadow: 0 8px 24px rgba(46, 204, 113, 0.40);
            font-weight: 600;
            font-size: 0.9rem;
            opacity: 0;
            transition: all 0.35s;
            z-index: 200;
            pointer-events: none;
        }
        .toast.show { transform: translate(-50%, 0); opacity: 1; }

        /* ---------- Scrollbar ---------- */
        ::-webkit-scrollbar { width: 11px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 10px;
        }

        ::selection { background: rgba(102, 126, 234, 0.35); color: #fff; }

        /* ---------- Ad placements ---------- */
        .ad-box {
            display: flex;
            max-width: 100%;
            margin: 26px auto;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: thin;
        }
        .ad-box > * {
            flex: 0 0 auto;
            margin: 0 auto;
        }
        .ad-box iframe { border: 0; }
        #stylesArea1b > .style-section:first-child,
        #stylesArea2 > .style-section:first-child,
        #stylesArea2b > .style-section:first-child { margin-top: 8px; }

        /* ---------- Sticky side ads (wide desktop screens only) ---------- */
        .ad-side {
            display: none;
            position: fixed;
            top: 110px;
            width: 300px;
            max-height: 620px;
            overflow: hidden;
            z-index: 30;
        }
        .ad-side.left  { left: 12px; }
        .ad-side.right { right: 12px; }
        @media (min-width: 1600px) {
            .ad-side { display: flex; flex-direction: column; }
        }

        /* ---------- Mobile: shrink 728px banners so the full ad is visible ---------- */
        @media (max-width: 767px) and (min-width: 561px) {
            .ad-box > iframe { zoom: 0.7; }
        }
        @media (max-width: 560px) {
            .ad-box > iframe { zoom: 0.48; }
        }

        /* ---------- Responsive ---------- */
        @media (max-width: 720px) {
            h1 { font-size: 1.9rem; }
            .toolbar { top: 6px; padding: 10px 12px; }
            .search-wrap { flex: 1 1 100%; }
            #searchInput { width: 100%; }
        }
        @media (max-width: 680px) {
            .grid { grid-template-columns: 1fr; }
        }
    </style>
</head>

            const rnd = arr => arr[Math.floor(Math.random() * arr.length)];
            return text.split('').map(ch => {
                if (ch === ' ') return ch;
                let out = ch;
                for (let i = 0; i < Math.floor(Math.random() * 3) + 1; i++) out += rnd(above);

            st('Dotted',           'effects', lineEffect('\u0307')),

            st('Wavy',             'effects', lineEffect('\u0334')),
            st('Wavy Lines',       'effects', t => t.split('').map(c => c === ' ' ? c : '\u032F' + c + '\u032F').join('')),
            st('Diacritic 1',      'effects', t => t.split('').map(c => c === ' ' ? c : c + '\u034E\u034E').join('')),
            st('Diacritic 2',      'effects', t => t.split('').map(c => c === ' ' ? c : c + '\u033E\u033E').join('')),
            st('Zalgo Glitch',     'effects', zalgo),
            st('Slash Through',    'effects', lineEffect('\u0337')),
            st('Spaced Out',       'effects', t => t.split('').join(' ')),
            st('Aesthetic',        'effects', t => conv(t, MAP.fullwidth).split('').join(' ')),

            /* --- Decorated & Framed --- */
            st('Floral Decorated',  'decorated', surround('✴.·´¯`·.·★ 🎀 ', ' 🎀 ★·.·`¯´·.✴', MAP.boldScript)),
            st('Block Gradient',    'decorated', surround('✩░▒▓▆▅▃▂▁', '▁▂▃▅▆▓▒░✩', MAP.bold)),
            st('Music Notes',       'decorated', surround('¸¸♬·¯·♪·¯·♫¸¸ ', ' ¸¸♫·¯·♪¸♩·¯·♬¸¸', MAP.boldScript)),
            st('Heart Emojis',      'decorated', surround('😍💞💘 ', ' 💔💏💖', MAP.boldScript)),
            st('Circle Text',       'decorated', surround('∙∙·▫▫ᵒᴼᵒ▫ₒₒ▫ᵒᴼ ', ' ᴼᵒ▫ₒₒ▫ᵒᴼᵒ▫▫·∙∙', MAP.circled)),
            st('Food Emojis',       'decorated', surround('🥕🍅🥬🥦 ', ' 🍆🥔🌽🥑', MAP.boldScript)),
            st('Box Style',         'decorated', t => '❚█══' + t + '══█❚'),
            st('Sparkle Decorated', 'decorated', surround('⋆｡°✩ ', ' ✩°｡⋆', MAP.boldScript)),
            st('Star Decorated',    'decorated', surround('★彡 ', ' 彡★', MAP.bold)),
            st('Japanese Brackets', 'decorated', surround('「 ', ' 」', MAP.boldScript)),
            st('Crown Decorated',   'decorated', surround('👑 ', ' 👑', MAP.bold)),
            st('Diamond Decorated', 'decorated', surround('◇◆◇ ', ' ◇◆◇', MAP.boldScript)),
            st('Sakura Decorated',  'decorated', surround('🌸🌸🌸 ', ' 🌸🌸🌸', MAP.boldScript)),
            st('Butterfly Decorated','decorated', surround('🦋 ', ' 🦋', MAP.boldScript)),
            st('Rainbow Decorated', 'decorated', surround('🌈🌈 ', ' 🌈🌈', MAP.boldScript)),
            st('Star Divider',      'decorated', surround('── ⋆⋅☆⋅⋆ ── ', ' ── ⋆⋅☆⋅⋆ ──', MAP.boldScript)),
            st('Kaomoji Happy',     'decorated', surround('(◕‿◕)♡ ', ' ♡(◕‿◕)', MAP.boldScript)),
            st('Royal Frame',       'decorated', surround('꧁༺ ', ' ༻꧂', MAP.bold)),
            st('Glitter Frame',     'decorated', surround('✧･ﾟ: *✧･ﾟ:* ', ' *:･ﾟ✧*:･ﾟ✧', MAP.boldScript)),
            st('Star Line Frame',   'decorated', surround('☆✼★━━━━ ', ' ━━━━★✼☆', MAP.bold)),
            st('Heart Hands',       'decorated', t => '(っ◔◡◔)っ ' + conv(t, MAP.boldScript)),
            st('Flower Circle',     'decorated', surround('✿°。 ', ' 。°✿', MAP.boldScript)),
            st('Soft Frame',        'decorated', surround('｡･ﾟﾟ･ ', ' ･ﾟﾟ･｡', MAP.boldScript)),

            /* --- Emoji Styles --- */
            st('Emoji Mix',  'emoji', t => conv(t, MAP.emojiMix)),
            st('Fire',       'emoji', t => t.split('').map(c => c + '🔥').join('')),
            st('Ice',        'emoji', t => t.split('').map(c => c + '❄️').join('')),
            st('Lightning',  'emoji', t => t.split('').map(c => c + '⚡').join('')),
            st('Hearts',     'emoji', t => t.split('').map(c => c + '❤️').join('')),
            st('Rainbow',    'emoji', t => t.split('').map(c => c + '🌈').join('')),
            st('Music Emoji','emoji', t => t.split('').map(c => c + '🎵').join('')),
            st('Flowers',    'emoji', t => t.split('').map(c => c + '🌸').join('')),
            st('Skeleton',   'emoji', t => t.split('').map(c => c + '💀').join('')),
            st('Droplets',   'emoji', t => t.split('').map(c => c + '💧').join('')),
            st('Moonlight',  'emoji', t => t.split('').map(c => c + '🌙').join('')),
            st('Party',      'emoji', t => t.split('').map(c => c + '🎉').join('')),
            st('Star Struck','emoji', t => t.split('').map(c => c + '⭐').join(''))
        ];

        const counts = {};
        CATS.forEach(c => { counts[c.id] = STYLES.filter(s => s.cat === c.id).length; });

        /* =====================================================
           DOM references & state
        ===================================================== */
        const textInput   = document.getElementById('textInput');
        const charCount   = document.getElementById('charCount');
        const clearBtn    = document.getElementById('clearBtn');
        const chipsEl     = document.getElementById('chips');
        const searchInput = document.getElementById('searchInput');
        const area        = document.getElementById('stylesArea');
        const area1b      = document.getElementById('stylesArea1b');
        const area2       = document.getElementById('stylesArea2');
        const area2b      = document.getElementById('stylesArea2b');
        const midAds      = ['midAdA', 'midAdN', 'midAd', 'midAdC'].map(id => document.getElementById(id));
        const toast       = document.getElementById('toast');
        const themeBtn    = document.getElementById('themeBtn');
        const totalEl     = document.getElementById('totalStyles');

        const SAMPLE = 'Fancy Text';
        let activeCat = 'all';
        let query = '';
        let toastTimer = null;

        function el(tag, cls, text) {
            const n = document.createElement(tag);
            if (cls) n.className = cls;
            if (text !== undefined) n.textContent = text;
            return n;
        }

        const displayText = () => textInput.value.trim() ? textInput.value : SAMPLE;

        /* =====================================================
           Copy to clipboard (with fallback for file:// use)
        ===================================================== */
        function showToast() {
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toast.classList.remove('show'), 1600);
        }

        function copyFancy(text, btn) {
            const done = () => {
                showToast();
                if (btn) {
                    btn.textContent = '✓ Copied';
                    btn.classList.add('copied');
                    setTimeout(() => {
                        btn.textContent = 'Copy';
                        btn.classList.remove('copied');
                    }, 1600);
                }
            };
            const fallback = () => {
                const ta = document.createElement('textarea');
                ta.value = text;
                ta.style.cssText = 'position:fixed;opacity:0;pointer-events:none;';
                document.body.appendChild(ta);
                ta.select();
                try { document.execCommand('copy'); done(); } catch (e) { console.error('Copy failed', e); }
                document.body.removeChild(ta);
            };
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(done).catch(fallback);
            } else {
                fallback();
            }
        }

        /* =====================================================
           Card builder
        ===================================================== */
        function buildCard(style, i, animate) {
            const card = el('div', 'style-card glass-card');
            if (animate) card.style.setProperty('--i', Math.min(i, 24));

            const head = el('div', 'card-head');
            head.appendChild(el('span', 'style-chip', CAT_ICON[style.cat] + ' ' + style.name));

            const btn = el('button', 'copy-btn', 'Copy');
            btn.type = 'button';
            head.appendChild(btn);

            const body = el('div', 'fancy-text', style.fn(displayText()));
            body.title = 'Click to copy';
            body.addEventListener('click', () => copyFancy(body.textContent, btn));
            btn.addEventListener('click', () => copyFancy(body.textContent, btn));

            card.appendChild(head);
            card.appendChild(body);
            return card;
        }

        /* =====================================================
           Middle ad visibility
        ===================================================== */
        function setMidAd(show) {
            midAds.forEach(a => { if (a) a.style.display = show ? '' : 'none'; });
        }

        /* =====================================================
           Render
        ===================================================== */
        function render(animate) {
            const isPreview = !textInput.value.trim() && !query;
            area.innerHTML = '';
            area1b.innerHTML = '';
            area2.innerHTML = '';
            area2b.innerHTML = '';

            if (isPreview) {
                area.appendChild(el('div', 'preview-hint', '👁 Preview with sample text — type above to make it yours'));
            }

            let list = STYLES;
            if (activeCat !== 'all') list = list.filter(s => s.cat === activeCat);
            if (query) list = list.filter(s => s.name.toLowerCase().includes(query));

            if (!list.length) {
                area.appendChild(el('div', 'empty-msg', '😕 No styles match "' + query + '". Try another word.'));
                setMidAd(false);
                return;
            }

            if (activeCat === 'all' && !query) {
                CATS.forEach((cat, ci) => {
                    const sec = el('section', 'style-section');
                    const head = el('div', 'section-head');
                    head.appendChild(el('h2', null, cat.icon + ' ' + cat.name));
                    head.appendChild(el('span', 'sec-count', String(counts[cat.id])));
                    head.appendChild(el('div', 'section-line'));
                    sec.appendChild(head);

                    const grid = el('div', 'grid' + (animate ? ' anim' : ''));
                    list.filter(s => s.cat === cat.id).forEach((s, i) => grid.appendChild(buildCard(s, i, animate)));
                    sec.appendChild(grid);
                    [area, area1b, area1b, area2, area2b][ci].appendChild(sec);
                });
                setMidAd(true);
            } else {
                const grid = el('div', 'grid' + (animate ? ' anim' : ''));
                list.forEach((s, i) => grid.appendChild(buildCard(s, i, animate)));
                area.appendChild(grid);
                setMidAd(false);
            }
        }

        /* =====================================================
           Category chips
        ===================================================== */
        function buildChips() {
            chipsEl.innerHTML = '';
            const mk = (id, label, cnt) => {
                const b = el('button', 'chip' + (activeCat === id ? ' active' : ''), label);
                b.type = 'button';
                b.appendChild(el('span', 'cnt', String(cnt)));
                b.addEventListener('click', () => { activeCat = id; buildChips(); render(true); });
                chipsEl.appendChild(b);
            };
            mk('all', '⭐ All', STYLES.length);
            CATS.forEach(c => mk(c.id, c.icon + ' ' + c.name, counts[c.id]));
        }

        /* =====================================================
           Theme toggle
        ===================================================== */
        function applyTheme(t) {
            document.body.dataset.theme = t;
            themeBtn.textContent = t === 'dark' ? '☀️' : '🌙';
        }
        themeBtn.addEventListener('click', () => {
            const next = document.body.dataset.theme === 'dark' ? 'light' : 'dark';
            try { localStorage.setItem('ftg-theme', next); } catch (e) { /* ignore */ }
            applyTheme(next);
        });
        let savedTheme = 'light';
        try { savedTheme = localStorage.getItem('ftg-theme') || 'light'; } catch (e) { /* ignore */ }
        applyTheme(savedTheme);

        /* =====================================================
           Events
        ===================================================== */
        function updateCharCount() {
            charCount.textContent = String(textInput.value.length);
            charCount.parentElement.classList.toggle('warn', textInput.value.length >= 80);
            clearBtn.style.display = textInput.value ? 'flex' : 'none';
        }

        textInput.addEventListener('input', () => {
            updateCharCount();
            render(false);
        });

        clearBtn.addEventListener('click', () => {
            textInput.value = '';
            updateCharCount();
            render(false);
            textInput.focus();
        });

        searchInput.addEventListener('input', () => {
            query = searchInput.value.trim().toLowerCase();
            render(true);
        });

        /* =====================================================
           Init
        ===================================================== */
        totalEl.textContent = String(STYLES.length);
        updateCharCount();
        buildChips();
        render(true);
    </script>
</body>
</html>
